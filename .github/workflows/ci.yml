name: CI

on:
  pull_request:
    # labeled/unlabeled so adding `skip-changelog` re-runs the changelog check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Base to compare against: the PR's target branch, or the previous master commit on push.
  BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for diff-cover and the scripts/checks base comparisons

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy app tests scripts

      - name: Tests + coverage (floor 88%)
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Coverage of critical modules (95%)
        run: coverage report --include="app/config.py,app/database.py" --fail-under=95

      - name: Coverage of changed lines (90%)
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch="$BASE_REF" --fail-under=90

      - name: pip-audit
        run: pip-audit -r requirements.txt

      - name: ShellCheck
        run: shellcheck installer/*.sh

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Check — migrations are append-only
        run: python scripts/checks/migrations_append_only.py --base "$BASE_REF"

      - name: Check — CHANGELOG updated
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python scripts/checks/changelog_updated.py --base "$BASE_REF" --labels "$PR_LABELS"

      - name: Check — docs allowlist
        run: python scripts/checks/docs_allowlist.py

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: pytest

      - name: Build stand-in MSI
        shell: pwsh
        run: ./installer/windows/build_msi.ps1 -Version 0.0.0-ci -OutDir dist
